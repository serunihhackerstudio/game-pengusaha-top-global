name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Build & uji satu hari (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Pasang dependensi
        run: npm ci

      - name: Build
        run: npm run build

      - name: Uji end-to-end (satu hari penuh)
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run test:e2e

      - name: Unggah screenshot uji
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-uji
          path: web/test/out/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Unggah hasil build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7
